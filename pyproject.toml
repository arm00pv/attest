[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attest-mcp"
version = "0.1.0"
description = "Verifiable memory and claim-checking for any AI. A verdict here comes from a checker, not a model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "arm00pv" }]
keywords = ["ai", "agents", "mcp", "verification", "provenance", "memory", "lean4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/arm00pv/attest"

[project.scripts]
attest = "attest.__main__:main"

[tool.setuptools]
packages = ["attest"]
